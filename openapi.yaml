openapi: 3.1.1
info:
  title: Itinerary API
  version: 1.0.0
  summary: A store of versioned travel itineraries, reached with bearer keys.
  description: |
    Holding a key is the permission. There are no users.

    | Key     | Prefix | Allows                                          |
    | ------- | ------ | ----------------------------------------------- |
    | Creator | `ck_`  | Creating documents, nothing else                |
    | Reader  | `rk_`  | Reading one document's published version        |
    | Editor  | `ek_`  | Reader actions, plus drafts, history, publishing |
    | Manager | `mk_`  | Editor actions, plus managing the document's keys |

    Keys travel only in `Authorization: Bearer <key>`. A missing, unknown, revoked or expired
    key gets the same `401`, which reveals nothing about why.

    Errors are Problem Details (RFC 9457). The `type` is `about:blank` when the status code says
    everything, and a `/problems/…` URI when a client needs to tell problems apart.

servers:
  - url: https://itinerary-api.info-cce.workers.dev
    description: Production (Cloudflare Workers Free, D1)
  - url: http://localhost:8787
    description: Local development (`npx wrangler dev`)

security:
  - bearerKey: []

paths:
  /v1/documents:
    post:
      operationId: createDocument
      summary: Create a document
      description: |
        Requires a creator key. Stores the body as version 1 and issues the document's first
        manager, editor and reader keys. The keys are shown only in this response and can never
        be retrieved again.

        The new document is unpublished, so its reader key gets `404` until a version is
        published.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentBody"
      responses:
        "201":
          description: Created. Store the keys now.
          headers:
            Location:
              description: The new document's URL.
              schema:
                type: string
                example: /v1/documents/7d1c0a4e-2b3f-4f60-9c1a-5e8d2f6b9a01
            ETag:
              description: The version just stored, always `"1"`.
              schema:
                type: string
                example: '"1"'
            Cache-Control:
              description: Always `no-store`, because the response contains keys.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The creator key has reached its cap on documents.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: /problems/document-limit-reached
                title: Document limit reached
                status: 409
                detail: This creator key can create at most 100 documents.
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

  /v1/documents/{id}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getLatestVersion
      summary: Read the latest working version
      description: |
        Requires an editor or manager key. Returns the newest version, published or not,
        exactly as stored. Use its `ETag` as `If-Match` when saving over it.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: |
            A version you already have, such as `"3"`. If it is still the latest, the response
            is `304` with no body. Weak tags, `*` and lists are accepted.
          schema:
            type: string
      responses:
        "200":
          description: The latest version.
          headers:
            ETag:
              $ref: "#/components/headers/VersionETag"
            Cache-Control:
              description: Always `private, no-cache`; revalidate with `If-None-Match`.
              schema:
                type: string
                const: private, no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentBody"
        "304":
          description: Not modified. The version in `If-None-Match` is still the latest.
          headers:
            ETag:
              $ref: "#/components/headers/VersionETag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          $ref: "#/components/responses/DocumentGone"

    patch:
      operationId: patchDocument
      summary: Change part of the latest version (JSON Merge Patch)
      description: |
        Editor or manager. The body is a JSON Merge Patch (RFC 7396) applied to the latest
        version: a member with a value sets it (objects merge recursively), a member that is
        `null` removes it, and arrays are replaced whole. The result is stored as a new full
        version, exactly as if it had been sent to `POST …/versions`.

        A merge patch can't set a value to `null`, and changing one element of an array means
        sending the whole array.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          $ref: "#/components/responses/VersionCreated"
        "400":
          $ref: "#/components/responses/BadIfMatchOrBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          $ref: "#/components/responses/DocumentGone"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            The patch isn't a JSON object, or the patched document would be over 200,000 bytes.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      operationId: deleteDocument
      summary: Delete the document
      description: |
        Editor or manager, with `If-Match` naming the latest version, so no one deletes a
        version they haven't seen. Stores a deletion marker as the next version and
        unpublishes the document, so readers get `404` at once.

        A deleted document can be restored until it is purged: see `POST …/versions`. The
        `ETag` of this response is the deletion marker's version, which restoring needs.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted.
          headers:
            ETag:
              description: The deletion marker's version, such as `"6"`.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadIfMatchOrBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          $ref: "#/components/responses/DocumentGone"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /v1/documents/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: listVersions
      summary: The history
      description: |
        Editor or manager; also while the document is deleted, so a version can be found to
        restore. The retained versions, newest first, without bodies: at most the newest 10
        plus the published one, so there is no pagination.
      responses:
        "200":
          description: The history.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/History"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: saveVersion
      summary: Save a new full version
      description: |
        Requires an editor or manager key. The body replaces the whole document, as the next
        version. Saving never changes what readers see: that changes only when a version is
        published.

        `If-Match` must name the version you edited. If someone saved after it, the response is
        `412`: fetch the latest version, apply your changes to it and save again. A retry of a
        save that succeeded but timed out also gets `412`.

        Only the newest 10 versions are kept, plus the published version if it is older.

        **Restoring a deleted document:** while the document is deleted, a save whose
        `If-Match` names the deletion marker (the `ETag` from `DELETE`, or `latest` in the
        history) restores it, with this body as its content: usually an earlier version's body
        from `GET …/versions/{version}`. The restored document is unpublished. Any other
        `If-Match` on a deleted document is `410`.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The version you edited, as a single strong tag such as `"3"`.
          schema:
            type: string
            pattern: '^"[1-9][0-9]*"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentBody"
      responses:
        "201":
          description: Saved. There is no response body.
          headers:
            Location:
              description: The new version's URL.
              schema:
                type: string
                example: /v1/documents/7d1c0a4e-2b3f-4f60-9c1a-5e8d2f6b9a01/versions/4
            ETag:
              $ref: "#/components/headers/VersionETag"
        "400":
          description: |
            `If-Match` isn't a single version tag, or the body isn't valid JSON or UTF-8.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          $ref: "#/components/responses/DocumentGone"
        "412":
          description: Someone saved a newer version after the one in `If-Match`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "428":
          description: "`If-Match` is missing."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/documents/{id}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - name: version
        in: path
        required: true
        description: The version number.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getVersion
      summary: Read one version
      description: |
        Editor or manager; also while the document is deleted. A version never changes, so
        the response may be cached for good.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The version's tag, such as `"3"`, if you have it already → `304`.
          schema:
            type: string
      responses:
        "200":
          description: The version, exactly as stored.
          headers:
            ETag:
              $ref: "#/components/headers/VersionETag"
            Cache-Control:
              description: Always `private, max-age=31536000, immutable`.
              schema:
                type: string
                const: private, max-age=31536000, immutable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentBody"
        "304":
          description: Not modified.
          headers:
            ETag:
              $ref: "#/components/headers/VersionETag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The document has no version with that number (it is above the latest).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: The version was pruned, or it is a deletion marker (which has no content).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/documents/{id}/published:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getPublishedVersion
      summary: Read the published version (what travellers see)
      description: |
        Any document key: reader, editor or manager. Returns the published version exactly as
        stored. Saving a new version doesn't change it; publishing does.

        Travellers' links carry the reader key in the URL fragment (`/doc/{id}#rk_…`), which
        never reaches the server; the client moves it into `Authorization`.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: |
            A version you already have, such as `"3"`. If it is still the published one, the
            response is `304` with no body. Weak tags, `*` and lists are accepted.
          schema:
            type: string
      responses:
        "200":
          description: The published version.
          headers:
            ETag:
              $ref: "#/components/headers/VersionETag"
            Cache-Control:
              description: Always `private, no-cache`; revalidate with `If-None-Match`.
              schema:
                type: string
                const: private, no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentBody"
        "304":
          description: Not modified. The version in `If-None-Match` is still the published one.
          headers:
            ETag:
              $ref: "#/components/headers/VersionETag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Nothing is published, or the document was deleted.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      operationId: publishVersion
      summary: Publish a version
      description: |
        Editor or manager. Makes exactly this version what travellers see, replacing any
        earlier publication. Publishing an earlier retained version reverts to it.

        Idempotent, and needs no `If-Match`: the request states the whole intended result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "204":
          description: Published.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          $ref: "#/components/responses/DocumentGone"
        "413":
          description: The body is over 1,000 bytes.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            The body isn't exactly `{ "version": <positive integer> }`, or that version can't be
            published: it doesn't exist, was pruned, or is a deletion marker.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: unpublish
      summary: Unpublish
      description: |
        Editor or manager. Afterwards readers get `404`. Idempotent: `204` even if nothing was
        published.
      responses:
        "204":
          description: Nothing is published now.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/documents/{id}/keys:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: listKeys
      summary: List the document's keys
      description: |
        Manager key. Every key on the document, revoked and expired ones included, oldest
        first. Never the keys themselves or their hashes: a key is shown only when issued.
      responses:
        "200":
          description: The keys.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                additionalProperties: false
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/KeySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: issueKey
      summary: Issue a key
      description: |
        Manager key. Issues one labelled key, for one person or device, on this document. The
        key is in this response only and can never be retrieved again.

        Label by role and device ("Kyoto desk – laptop"), not by a person's name: a name
        would be personal data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueKeyRequest"
      responses:
        "201":
          description: Issued. Store the key now.
          headers:
            Location:
              description: The new key's URL.
              schema:
                type: string
                example: /v1/documents/7d1c0a4e-2b3f-4f60-9c1a-5e8d2f6b9a01/keys/3f9c2b1e-…
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The document already has 20 unrevoked keys. Revoke one first.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: /problems/key-limit-reached
                title: Key limit reached
                status: 409
        "410":
          $ref: "#/components/responses/DocumentGone"
        "413":
          $ref: "#/components/responses/SmallBodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            The body doesn't match `IssueKeyRequest`, `expiresAt` is in the past or not a real
            date, or an expiry was given for a manager key (manager keys never expire).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/documents/{id}/keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - name: keyId
        in: path
        required: true
        description: The key's public ID, from the key list or from issuing it.
        schema:
          type: string
          format: uuid
    patch:
      operationId: setKeyExpiry
      summary: Change a key's expiry
      description: |
        Manager key. `{ "expiresAt": "YYYY-MM-DD" }` sets or extends the expiry; the key works
        through the whole of that day (UTC). Extending an expired key reactivates it, so
        changed trip dates don't need a new link. `{ "expiresAt": null }` removes the expiry.

        The body is a JSON Merge Patch (RFC 7396). No `If-Match` needed: the request states
        the whole intended result.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/SetKeyExpiryRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/SetKeyExpiryRequest"
      responses:
        "204":
          description: Changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/KeyNotFound"
        "409":
          description: The key is revoked, and a revoked key can never be reactivated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: /problems/key-revoked
                title: Key revoked
                status: 409
        "413":
          $ref: "#/components/responses/SmallBodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            The body doesn't match `SetKeyExpiryRequest`, the date is in the past or not a real
            date, or it is a manager key (manager keys never expire).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: revokeKey
      summary: Revoke a key
      description: |
        Manager key. The key stops working at once, everywhere. Revoking it again is safe and
        keeps the original time. A manager key can't revoke itself: to replace one, issue a new
        manager key, then use it to revoke the old one.
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/KeyNotFound"
        "409":
          description: A manager key tried to revoke itself.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: /problems/cannot-revoke-own-key
                title: Cannot revoke own key
                status: 409

components:
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version you are changing, as a single strong tag such as `"3"`.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    DocumentId:
      name: id
      in: path
      required: true
      description: The document's public ID.
      schema:
        type: string
        format: uuid

  headers:
    NoStore:
      description: Always `no-store`.
      schema:
        type: string
        const: no-store
    VersionETag:
      description: The version number as a strong entity tag, such as `"3"`.
      schema:
        type: string
        example: '"3"'

  securitySchemes:
    bearerKey:
      type: http
      scheme: bearer
      description: A key with one of the prefixes `ck_`, `rk_`, `ek_` or `mk_`.

  schemas:
    DocumentBody:
      description: |
        An itinerary. Until the itinerary schema is designed, any JSON object (not an array or
        a single value) of at most 200,000 bytes of UTF-8. Never put personal data in it: no
        traveller names, contact, passport or payment details.
      type: object
      additionalProperties: true

    PublishRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
          description: The version to publish.

    Permission:
      type: string
      enum: [reader, editor, manager]

    ExpiryDate:
      type: string
      format: date
      description: |
        The last day the key works, `YYYY-MM-DD`, read in UTC: the key works through the whole
        of that day.
      example: "2027-04-30"

    Label:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        Names a role and a device, such as "Kyoto desk – laptop", never a person. Trimmed; no
        control characters.

    KeySummary:
      type: object
      required:
        [id, permission, label, createdAt, lastUsedAt, expiresAt, revokedAt, status, isCurrentKey]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        permission:
          $ref: "#/components/schemas/Permission"
        label:
          type: [string, "null"]
          description: The trip's three initial keys are labelled "Initial … key".
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
          description: Approximate, updated at most hourly. `null` if never used.
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/ExpiryDate"
            - type: "null"
        revokedAt:
          type: [string, "null"]
          format: date-time
        status:
          type: string
          enum: [active, expired, revoked]
        isCurrentKey:
          type: boolean
          description: True for the key making this request.

    IssueKeyRequest:
      type: object
      required: [permission, label]
      additionalProperties: false
      properties:
        permission:
          $ref: "#/components/schemas/Permission"
        label:
          $ref: "#/components/schemas/Label"
        expiresAt:
          $ref: "#/components/schemas/ExpiryDate"

    IssuedKey:
      type: object
      required: [id, key, permission, label, expiresAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: "#/components/schemas/Key"
        permission:
          $ref: "#/components/schemas/Permission"
        label:
          type: string
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/ExpiryDate"
            - type: "null"

    SetKeyExpiryRequest:
      type: object
      required: [expiresAt]
      additionalProperties: false
      properties:
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/ExpiryDate"
            - type: "null"
          description: A date sets or extends the expiry; `null` removes it.

    History:
      type: object
      required: [latest, oldestAvailable, published, versions]
      additionalProperties: false
      properties:
        latest:
          type: integer
          description: The latest version; a deletion marker if the document is deleted.
        oldestAvailable:
          type: integer
          description: The oldest version still stored.
        published:
          type: [integer, "null"]
          description: The published version, or `null`.
        versions:
          type: array
          description: Newest first.
          items:
            type: object
            required: [version, createdAt, createdBy, deleted]
            additionalProperties: false
            properties:
              version:
                type: integer
              createdAt:
                type: string
                format: date-time
              createdBy:
                type: [string, "null"]
                format: uuid
                description: |
                  The ID of the key that saved it (see the key list); `null` for version 1,
                  made when the document was created.
              deleted:
                type: boolean
                description: A deletion marker, which has no content.

    CreatedDocument:
      type: object
      required: [id, managerKey, editorKey, readerKey]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The document's public ID.
        managerKey:
          $ref: "#/components/schemas/Key"
        editorKey:
          $ref: "#/components/schemas/Key"
        readerKey:
          $ref: "#/components/schemas/Key"

    Key:
      type: string
      description: A prefix, then 43 base64url characters. A secret, shown once.
      pattern: "^(ck|rk|ek|mk)_[A-Za-z0-9_-]{43}$"

    Problem:
      description: Problem Details (RFC 9457).
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

  responses:
    VersionCreated:
      description: Saved as a new version. There is no response body.
      headers:
        Location:
          description: The new version's URL.
          schema:
            type: string
            example: /v1/documents/7d1c0a4e-2b3f-4f60-9c1a-5e8d2f6b9a01/versions/4
        ETag:
          $ref: "#/components/headers/VersionETag"
    BadIfMatchOrBody:
      description: "`If-Match` isn't a single version tag, or the body isn't valid JSON or UTF-8."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: Someone wrote a newer version after the one in `If-Match`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: "`If-Match` is missing."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The body isn't valid JSON or valid UTF-8.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: |
        The key is missing, malformed, unknown, revoked, expired or of the wrong kind. All of
        these get the same response.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ContentTooLarge:
      description: The body is over 200,000 bytes.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The body isn't `application/json`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    KeyNotFound:
      description: There is no key with that ID on this document.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    SmallBodyTooLarge:
      description: The body is over 1,000 bytes.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The key is valid on this document but doesn't allow this operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    DocumentGone:
      description: The document was deleted.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableContent:
      description: The body is valid JSON but not a JSON object.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
